  <script>
    // Hide the boot spinner once the page has loaded (or after 2.5s at most: third-party embeds can hold
    // the load event open), then drop it from the DOM so its animation stops costing frames.
    (function () {
      var done = false;
      function ready() {
        if (done) return; done = true;
        document.body.classList.add('app-ready');
        setTimeout(function () {
          var el = document.querySelector('.loading-screen');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 400);
      }
      window.addEventListener('load', function () { setTimeout(ready, 200); });
      setTimeout(ready, 2500);
    })();
  </script>
